<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freela da Moda - Minhas Vagas</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>

        <!-- Conteúdo Principal -->
        <main class="main">
            <div id="perfil-loading" class="text-center">
                <p>Carregando vagas...</p>
            </div>

            <div id="perfil-erro" class="alert" role="alert" aria-live="polite" hidden>
                Não foi possível carregar as vagas. Tente novamente mais tarde.
            </div>

            <div id="perfil-conteudo" hidden>
                <div class="header">
                    <h2>Minhas Vagas</h2>
                    <div class="header-actions" id="header-acoes"></div>
                </div>

                <div class="alert alert-error mb-md" id="msg-empty" aria-live="polite" hidden></div>

                <div id="cardFiltros">
                    <section class="mural-header">
                        <span class="badge"><i class="bi bi-briefcase"></i> MINHAS VAGAS</span>
                        <h1>Minhas Vagas</h1>
                        <p>Gerencie as oportunidades que você publicou na plataforma.</p>

                        <div class="filter-bar filter-bar--6">
                            <input type="text" id="filtroTitulo" placeholder="Buscar por título..." />
                            <select id="filtroStatus">
                                <option value="" selected>Todos os status</option>
                                <option value="Aberta">Aberta</option>
                                <option value="Pausada">Pausada</option>
                                <option value="Encerrada">Encerrada</option>
                            </select>
                            <select id="filtroOrdenar">
                                <option value="recentes" selected>Mais recentes</option>
                                <option value="valor">Maior valor</option>
                                <option value="prazo">Prazo mais próximo</option>
                            </select>
                            <select id="filtroEstado">
                                <option value="">Todos os estados</option>
                            </select>
                            <div class="autocomplete-wrapper">
                                <input type="text" id="filtroCidade" placeholder="Cidade..." autocomplete="off" />
                            </div>
                            <button type="button" class="btn btn-purple-bright" id="btnLimparFiltros">
                                <i class="bi bi-x-circle"></i> Limpar
                            </button>
                        </div>
                    </section>
                </div>

                <div class="card table-responsive" id="cardTabela">
                    <table class="table" aria-label="Tabela de vagas publicadas">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Status</th>
                                <th>Local</th>
                                <th>Valor</th>
                                <th>Prazo</th>
                                <th>Publicação</th>
                                <th>Candidatos</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyVagas"></tbody>
                    </table>
                    <div class="pagination">
                        <button class="btn" type="button" id="btnPaginaAnterior" disabled>Anterior</button>
                        <span id="resumoPaginas">Mostrando 0 de 0</span>
                        <button class="btn" type="button" id="btnPaginaProxima" disabled>Próxima</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/15-minhas-vagas.js"></script>
</body>
</html>
