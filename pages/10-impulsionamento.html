<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impulsionamento</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <div class="app">
      <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
      </button>
      <div class="sidebar-overlay"></div>
      <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>
      <main class="main" role="main" aria-label="Conteúdo principal">
        <div class="header">
          <h2>Impulsionamento</h2>
          <div class="header-actions" id="header-acoes"></div>
        </div>
        <div id="mensagemStatus" class="alert mb-md" role="alert" aria-live="polite" hidden></div>
        <section class="grid grid-2">
          <div class="card">
            <div class="section-title">Plano Atual</div>
            <p>Free</p>
            <p>Status: visibilidade padrão</p>
          </div>
          <div class="card">
            <div class="section-title">Próxima cobrança / status</div>
            <p>Sem cobrança ativa.</p>
            <span class="badge">Ativo</span>
          </div>
        </section>
        <section class="card mt-md">
          <div class="section-title">Planos Existentes</div>
          <div class="grid grid-2">
            <div class="card stack-sm">
              <h3>Premium</h3>
              <p style="font-size: 22px; font-weight: 800; color: var(--color-primary);">R$ 14,90<span style="font-size: 14px; font-weight: 400;">/mês</span></p>
              <p>Mais visibilidade nas buscas.</p>
              <button class="btn btn-primary">Assinar</button>
            </div>
            <div class="card stack-sm">
              <h3>Pro</h3>
              <p style="font-size: 22px; font-weight: 800; color: var(--color-primary);">R$ 29,90<span style="font-size: 14px; font-weight: 400;">/mês</span></p>
              <p>Destaque máximo no mural.</p>
              <button class="btn btn-primary">Assinar</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/10-impulsionamento.js"></script>
  </body>
</html>
