<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freela da Moda - Publicar Vaga / Cadastrar Serviço</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>

        <!-- Conteúdo Principal -->
        <main class="main">
            <div class="header">
                <h2>Publicar Vaga</h2>
                <div class="header-actions" id="header-acoes"></div>
            </div>

            <div class="page-container-md">

                <!-- Mensagem Feedback -->
                <div id="alert-publicar-vaga" class="alert alert-success mb-md" role="alert" aria-live="polite" hidden></div>

                <!-- Formulário de Cadastro -->
                <form id="formPublicarVaga" class="card stack" novalidate>
                    <span class="section-title">Informações do Serviço</span>

                    <!-- Título da Vaga -->
                    <div class="form-group">
                        <label for="titulo" class="checkbox-label"><strong>Título do Serviço / Vaga *</strong></label>
                        <input type="text" id="titulo" class="input" placeholder="Ex: Costureira Pilotista para Moda Feminina" required>
                    </div>

                    <!-- Especialidade e Modalidade -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="especialidade"><strong>Especialidade *</strong></label>
                            <select id="especialidade" class="input" required>
                                <option value="">Selecione uma especialidade</option>
                                <option value="Costura reta">Costura reta</option>
                                <option value="Overloque">Overloque</option>
                                <option value="Modelagem">Modelagem</option>
                                <option value="Peça piloto">Peça piloto</option>
                                <option value="Acabamento">Acabamento</option>
                                <option value="Bordado">Bordado</option>
                                <option value="Estamparia">Estamparia</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="modalidade"><strong>Modalidade *</strong></label>
                            <select id="modalidade" class="input" required>
                                <option value="">Selecione</option>
                                <option value="Presencial">Presencial</option>
                                <option value="Híbrida">Híbrida</option>
                                <option value="Remota">Remota</option>
                                <option value="Sob demanda">Sob demanda</option>
                            </select>
                        </div>
                    </div>

                    <!-- Cidade e Estado -->
                    <div class="form-row">
                        <div class="form-group autocomplete-wrapper">
                            <label for="cidade"><strong>Cidade *</strong></label>
                            <input type="text" id="cidade" class="input" placeholder="Ex: Blumenau" required>
                        </div>

                        <div class="form-group">
                            <label for="estado"><strong>Estado (UF) *</strong></label>
                            <select id="estado" class="input" required></select>
                        </div>
                    </div>

                    <!-- Valor e Prazos -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="valor"><strong>Valor Oferecido (R$) *</strong></label>
                            <input type="text" id="valor" class="input" placeholder="R$ 0,00" required>
                        </div>

                        <div class="form-group date-input-wrapper">
                            <label for="prazo"><strong>Prazo Máximo de Conclusão *</strong></label>
                            <input type="date" id="prazo" class="input" required>
                        </div>
                    </div>

                    <!-- Descrição -->
                    <div class="form-group">
                        <label for="descricao"><strong>Descrição Detalhada *</strong></label>
                        <textarea id="descricao" class="input" placeholder="Descreva o escopo do serviço, quantidade de peças, tipo de tecido e detalhes do trabalho..." required></textarea>
                    </div>

                    <!-- Referências Visuais / Upload -->
                    <div class="form-group">
                        <label for="refs-vaga"><strong>Referências Visuais / Briefing (máximo 10)</strong></label>
                        <div class="upload-row">
                            <label class="btn btn-outline" for="refs-vaga">
                                <i class="bi bi-images"></i> Adicionar fotos
                            </label>
                            <input type="file" id="refs-vaga" accept="image/*" multiple hidden />
                        </div>
                        <div class="referencias-grid" id="refs-vaga-preview"></div>
                        <span class="field-message">Cada imagem deve ter até 5MB.</span>
                    </div>

                    <!-- Ações do Formulário -->
                    <div class="form-actions">
                        <a href="/pages/04-dashboard-empresa.html" class="btn btn-outline">Cancelar</a>
                        <button type="submit" class="btn btn-primary" id="btnSubmit">
                            <i class="bi bi-send-fill"></i> Publicar Vaga
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/12-publicar-vaga.js"></script>
</body>
</html>
