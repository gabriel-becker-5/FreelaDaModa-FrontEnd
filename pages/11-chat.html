<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restaura o tema salvo antes da primeira renderização (evita flash) e
      // mantém localStorage sincronizado sempre que data-theme mudar,
      // não importa qual botão/página fez a mudança.
      (function () {
        var root = document.documentElement;
        function sincronizarIcone(tema) {
          document.querySelectorAll('.theme-toggle i').forEach(function (icone) {
            icone.className = tema === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
          });
        }
        try {
          var salvo = localStorage.getItem('fdlm-theme');
          if (salvo) root.setAttribute('data-theme', salvo);
        } catch (e) {}
        new MutationObserver(function () {
          var atual = root.getAttribute('data-theme');
          try { localStorage.setItem('fdlm-theme', atual); } catch (e) {}
          sincronizarIcone(atual);
        }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
        document.addEventListener('DOMContentLoaded', function () {
          sincronizarIcone(root.getAttribute('data-theme'));
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>

  <span class="hamburger-line"></span>
</button>
<div class="sidebar-overlay"></div>
<aside class="sidebar" role="navigation" aria-label="Menu principal">
        <a href="/pages/01-homepage.html" class="brand">

      <main class="main" role="main" aria-label="Conteúdo principal">
        <div class="header"><h2>Chat</h2></div>
        <div class="chat-layout">
          <section class="card">
            <strong>Lista de Chats</strong>
            <div class="chat-list">
              <button class="btn" style="justify-content: flex-start; gap: 10px;">
                <span class="online-dot"></span>
                <span>Empresa X</span>
              </button
              ><button class="btn" style="justify-content: flex-start; gap: 10px;">
                <span class="online-dot"></span>
                <span>Confecção Y</span>
              </button
              ><button class="btn" style="justify-content: flex-start; gap: 10px;">
                <span class="chat-avatar" style="width: 24px; height: 24px; font-size: 11px;">M</span>
                <span>Freelancer Maria</span>
              </button>
            </div>
            <div class="empty-state mt-md" aria-live="polite">
              Nenhuma conversa selecionada.
            </div>
          </section>
          <section class="card">
            <strong>Histórico do chat selecionado</strong>
            <div class="chat-thread">
              <div style="display: flex; gap: 8px; align-items: flex-end;">
                <span class="chat-avatar">CX</span>
                <div class="message-row">
                  Olá, tudo bem?
                  <span class="message-timestamp">10:30</span>
                </div>
              </div>
              <div class="message-row message-row-outgoing">
                Sim, podemos iniciar.
                <span class="message-timestamp">10:32</span>
              </div>
              <div style="display: flex; gap: 8px; align-items: flex-end;">
                <span class="chat-avatar">CX</span>
                <div class="message-row">
                  Enviei as referências visuais.
                  <span class="message-timestamp">10:35</span>
                </div>
              </div>
              <div class="typing-indicator">
                <span></span><span></span><span></span>
              </div>
            </div>
            <div class="cluster mt-md">
              <input
                id="mensagem"
                class="input input-grow"
                placeholder="Digite sua mensagem..."
              /><button class="btn" style="padding: 10px;" aria-label="Anexar arquivo"><i class="bi bi-paperclip"></i></button
              ><button class="btn btn-primary"><i class="bi bi-send-fill"></i> Enviar</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="/js/11-chat.js"></script>
