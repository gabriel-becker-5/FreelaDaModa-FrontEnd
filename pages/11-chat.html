<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <div class="app">
      <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
  <span class="hamburger-line"></span>
</button>
<div class="sidebar-overlay"></div>
<aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>
      <main class="main" role="main" aria-label="Conteúdo principal">
        <div class="header">
          <h2>Chat</h2>
          <div class="header-actions" id="header-acoes"></div>
        </div>
        <div id="mensagemStatus" class="alert mb-md" role="alert" aria-live="polite" hidden></div>
        <div class="chat-layout">
          <section class="card">
            <strong>Minhas Conversas</strong>
            <div class="chat-list" id="lista-conversas">
              <p class="text-muted" style="font-size: 13px; margin-top: 8px;">Carregando conversas...</p>
            </div>
          </section>
          <section class="card">
            <strong id="titulo-thread">Histórico do chat selecionado</strong>
            <div class="chat-thread" id="chat-thread"></div>
            <div class="empty-state mt-md" id="empty-state-thread" aria-live="polite">
              Suas conversas aparecem aqui automaticamente depois que uma candidatura for aprovada (match) entre você e a outra parte. Selecione uma conversa ao lado para começar.
            </div>
            <div class="cluster mt-md" id="area-envio-mensagem" hidden>
              <input
                id="mensagem"
                class="input input-grow"
                placeholder="Digite sua mensagem..."
              /><button class="btn btn-primary" id="btn-enviar-mensagem"><i class="bi bi-send-fill"></i> Enviar</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/11-chat.js"></script>
  </body>
</html>
