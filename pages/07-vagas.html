<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural de Vagas | Freela da Moda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/global.css" />
</head>
<body>

    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal">
        <a href="/pages/01-homepage.html" class="brand">
            <img src="/assets/logo-icone-branco-2048.png" alt="Logo Freela" class="brand-logo" />
            <span class="brand-text">FREELA<span class="brand-sub">DA MODA</span></span>
        </a>
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Alternar tema claro e escuro">
            <i class="bi bi-moon-stars" aria-hidden="true"></i>
        </button>
        <a href="/pages/03-dashboard-freelancer.html" id="link-dashboard">Dashboard</a>
        <a class="active" href="/pages/07-vagas.html" aria-current="page">Vagas</a>
        <a href="/pages/20-minhas-candidaturas.html">Candidaturas/OS</a>
        <a href="/pages/08-perfil-freelancer.html">Perfil</a>
        <a href="/pages/11-chat.html">Chat</a>
        <a href="/pages/10-impulsionamento.html">Impulsionamento</a>
        <a href="/pages/24-suporte.html">Suporte</a>
    </aside>
    <main class="main" role="main" aria-label="Conteúdo principal">
        <div class="header">
            <h2>Mural de Vagas</h2>
            <div class="header-actions">
                <span id="user-greeting" style="font-size: 0.9rem; font-weight: 600; color: var(--color-primary);"></span>
                <a href="/pages/02-login.html" class="btn btn-outline-purple" id="btn-auth">Entrar</a>
            </div>
        </div>

        <div id="mensagemStatus" class="alert" role="alert" aria-live="polite" hidden></div>

        <!-- CABEÇALHO COM FILTROS -->
        <section class="mural-header">
            <span class="badge"><i class="bi bi-briefcase"></i> OPORTUNIDADES ABERTAS</span>
            <h1>Mural de Vagas para Confecção</h1>
            <p>Encontre trabalhos sob demanda ou contratos fixos com confecções de todo o Brasil.</p>

            <div class="filter-bar">
                <input type="text" id="filtro-busca" placeholder="Buscar por título, descrição ou confecção..." />
                <select id="filtro-especialidade">
                    <option value="">Todas as especialidades</option>
                    <option value="Costura reta">Costura reta</option>
                    <option value="Overloque">Overloque</option>
                    <option value="Modelagem">Modelagem</option>
                    <option value="Peça piloto">Peça piloto</option>
                    <option value="Acabamento">Acabamento</option>
                    <option value="Bordado">Bordado</option>
                    <option value="Estamparia">Estamparia</option>
                </select>
                <button type="button" class="btn btn-purple-bright" id="btn-limpar-filtros">
                    <i class="bi bi-x-circle"></i> Limpar
                </button>
            </div>
        </section>

        <!-- LISTAGEM DE CARDS DE VAGAS -->
        <section class="jobs-layout" id="lista-vagas">
            <!-- Vagas renderizadas dinamicamente pelo vagas.js -->
        </section>

    </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/07-vagas.js"></script>
</body>
</html>
