<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freela da Moda - Candidatos da Vaga</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>

        <!-- Conteúdo Principal -->
        <main class="main">
            <div id="perfil-loading" class="text-center">
                <p>Carregando candidatos...</p>
            </div>

            <div id="perfil-erro" class="alert" role="alert" aria-live="polite" hidden>
                Não foi possível carregar esta vaga. Tente novamente mais tarde.
            </div>

            <div id="perfil-conteudo" hidden>
                <div class="header">
                    <h2>Candidatos da Vaga</h2>
                    <div class="header-actions" id="header-acoes"></div>
                </div>

                <div id="mensagemStatus" class="alert mb-md" role="alert" aria-live="polite" hidden></div>
                <div class="alert alert-error mb-md" id="msg-empty" aria-live="polite" hidden></div>

                <div id="cardFiltros">
                    <section class="mural-header">
                        <span class="badge"><i class="bi bi-people"></i> CANDIDATOS DA VAGA</span>
                        <h1 id="tituloVaga">Carregando...</h1>
                        <p>Analise os profissionais interessados e selecione o melhor para a sua demanda.</p>

                        <div class="filter-bar filter-bar--3">
                            <input type="text" id="filtroNome" placeholder="Buscar por nome..." />
                            <select id="filtroStatus">
                                <option value="" selected>Todos os status</option>
                                <option>Em análise</option>
                                <option>Selecionado</option>
                                <option>Rejeitado</option>
                                <option>Cancelada</option>
                            </select>
                            <button type="button" class="btn btn-purple-bright" id="btnLimparFiltros">
                                <i class="bi bi-x-circle"></i> Limpar
                            </button>
                        </div>
                    </section>
                </div>

                <div class="card table-responsive" id="cardTabela">
                    <table class="table" aria-label="Tabela de candidatos">
                        <thead>
                            <tr>
                                <th>Profissional</th>
                                <th>Especialidades</th>
                                <th>Disponibilidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCandidatos"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/17-candidatos-vaga.js"></script>
</body>
</html>
