<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural de Freelancers | Freela da Moda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/global.css" />
</head>
<body>

    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal">
        <a href="/pages/01-homepage.html" class="brand">
            <img src="/assets/logo-icone-branco-2048.png" alt="Logo Freela" class="brand-logo" />
            <span class="brand-text">FREELA<span class="brand-sub">DA MODA</span></span>
        </a>
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Alternar tema claro e escuro">
            <i class="bi bi-moon-stars" aria-hidden="true"></i>
        </button>
        <a href="/pages/04-dashboard-empresa.html" id="link-dashboard">Dashboard</a>
        <a href="/pages/12-publicar-vaga.html">Publicar Vaga</a>
        <a href="/pages/15-minhas-vagas.html">Minhas Vagas</a>
        <a class="active" href="/pages/27-mural-freelancers.html" aria-current="page">Buscar Freelancers</a>
        <a href="/pages/11-chat.html">Chat</a>
        <a href="/pages/16-ordens-servico.html">Ordens de Serviço</a>
        <a href="/pages/09-perfil-empresa.html">Perfil</a>
        <a href="/pages/21-assinatura.html">Assinatura</a>
        <a href="/pages/24-suporte.html">Suporte</a>
    </aside>
    <main class="main" role="main" aria-label="Conteúdo principal">
        <div class="header">
            <h2>Mural de Freelancers</h2>
            <div class="header-actions">
                <span id="user-greeting" style="font-size: 0.9rem; font-weight: 600; color: var(--color-primary);"></span>
                <a href="/pages/02-login.html" class="btn btn-outline-purple" id="btn-auth">Entrar</a>
            </div>
        </div>

        <!-- CABEÇALHO COM FILTROS -->
        <section class="mural-header">
            <span class="badge"><i class="bi bi-people"></i> TALENTOS DA MODA</span>
            <h1>Encontre o profissional certo para sua confecção</h1>
            <p>Busque por nome ou especialidade entre os freelancers cadastrados na plataforma.</p>

            <div class="filter-bar">
                <input type="text" id="filtro-busca" placeholder="Buscar por nome ou especialidade..." />
                <select id="filtro-especialidade">
                    <option value="">Todas as especialidades</option>
                </select>
                <button type="button" class="btn btn-purple-bright" id="btn-limpar-filtros">
                    <i class="bi bi-x-circle"></i> Limpar
                </button>
            </div>
        </section>

        <!-- LISTAGEM DE CARDS DE FREELANCERS -->
        <section class="freelancers-layout" id="lista-freelancers">
            <!-- Freelancers renderizados dinamicamente pelo 27-mural-freelancers.js -->
        </section>

    </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/27-mural-freelancers.js"></script>
</body>
</html>
