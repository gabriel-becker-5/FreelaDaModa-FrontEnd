<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural de Freelancers | Freela da Moda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/global.css" />
</head>
<body>

    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>

    <main class="main" role="main" aria-label="Conteúdo principal">
        <div class="header">
            <h2>Mural de Freelancers</h2>
            <div class="header-actions" id="header-acoes"></div>
        </div>

        <!-- CABEÇALHO COM FILTROS -->
        <section class="mural-header">
            <span class="badge"><i class="bi bi-people"></i> TALENTOS DA MODA</span>
            <h1>Encontre o profissional certo para sua confecção</h1>
            <p>Busque por nome, especialidade ou localidade entre os freelancers cadastrados na plataforma.</p>

            <div class="filter-bar">
                <input type="text" id="filtro-busca" placeholder="Buscar por nome ou especialidade..." />
                <select id="filtro-especialidade">
                    <option value="">Todas as especialidades</option>
                </select>
                <select id="filtro-estado">
                    <option value="">Todos os estados</option>
                </select>
                <div class="autocomplete-wrapper">
                    <input type="text" id="filtro-cidade" placeholder="Cidade..." autocomplete="off" />
                </div>
                <button type="button" class="btn btn-purple-bright" id="btn-limpar-filtros">
                    <i class="bi bi-x-circle"></i> Limpar
                </button>
            </div>
        </section>

        <!-- LISTAGEM DE CARDS DE FREELANCERS -->
        <section class="freelancers-layout" id="lista-freelancers">
            <!-- Freelancers renderizados dinamicamente pelo 27-mural-freelancers.js -->
        </section>

    </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/27-mural-freelancers.js"></script>
</body>
</html>
