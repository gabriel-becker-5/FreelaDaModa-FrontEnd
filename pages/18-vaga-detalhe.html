<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freela da Moda - Detalhe da Vaga</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>

        <!-- Conteúdo Principal -->
        <main class="main">
            <div class="header">
                <h2>Detalhe da Vaga</h2>
                <div class="header-actions" id="header-acoes"></div>
            </div>

            <div class="page-container-md">

                <!-- Feedback -->
                <div id="mensagemStatus" class="alert mb-md" role="alert" aria-live="polite" hidden></div>

                <!-- Estado de carregamento -->
                <div id="vagaLoading" class="text-center">
                    <p>Carregando vaga...</p>
                </div>

                <!-- Estado de erro -->
                <div id="vagaErro" class="alert" role="alert" aria-live="polite" hidden>
                    Não foi possível carregar esta vaga. Tente novamente mais tarde.
                </div>

                <!-- Card Principal da Vaga -->
                <div class="card stack mb-md animate-fade-in" id="vagaConteudo" hidden>
                    <div class="cluster-between" style="align-items: flex-start;">
                        <div>
                            <h2 style="font-size: 24px; color: var(--color-primary); margin-bottom: 4px;" id="vaga-titulo">—</h2>
                            <p class="text-muted"><i class="bi bi-building"></i> <span id="vaga-empresa">—</span> &nbsp;&nbsp;|&nbsp;&nbsp; <i class="bi bi-geo-alt-fill"></i> <span id="vaga-local">—</span></p>
                        </div>
                        <span class="badge badge-success" id="vaga-status-badge">Aberta</span>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 12px 0;">

                    <!-- Informações em Grid -->
                    <div class="grid-2">
                        <div>
                            <p class="text-muted" style="font-size: 13px;">Especialidade | Modalidade</p>
                            <p><strong id="vaga-especialidade-modalidade">—</strong></p>
                        </div>
                        <div>
                            <p class="text-muted" style="font-size: 13px;">Valor Oferecido</p>
                            <p><strong class="text-primary" style="font-size: 18px;" id="vaga-valor">—</strong></p>
                        </div>
                        <div>
                            <p class="text-muted" style="font-size: 13px;">Prazo de Entrega</p>
                            <p><strong id="vaga-prazo">—</strong></p>
                        </div>
                    </div>

                    <h3 class="mt-md" style="font-size: 16px;">Descrição do Serviço</h3>
                    <p style="background: var(--surface-alt); padding: 16px; border-radius: 8px;" id="vaga-descricao">—</p>

                    <h3 class="mt-md" style="font-size: 16px;">Referências Visuais</h3>
                    <div class="referencias-grid" id="lista-referencias-vaga">
                        <span class="field-message">Nenhuma referência enviada pela empresa.</span>
                    </div>

                    <!-- Ações dinâmicas (candidatar / editar / encerrar) -->
                    <div class="form-actions mt-lg" style="justify-content: center; padding-top: 16px; border-top: 1px solid var(--border);" id="acoes-vaga"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/18-vaga-detalhe.js"></script>
</body>
</html>
