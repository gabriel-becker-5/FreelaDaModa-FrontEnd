<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freela da Moda - Editar Ordem de Serviço</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app">
    <button class="sidebar-toggle-btn" type="button" aria-label="Abrir menu" aria-expanded="false">
        <span class="hamburger-line"></span>
    </button>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar" role="navigation" aria-label="Menu principal"></aside>

        <!-- Conteúdo Principal -->
        <main class="main">
            <div class="header">
                <h2>Editar Ordem de Serviço</h2>
                <div class="header-actions" id="header-acoes"></div>
            </div>

            <div class="page-container-md">

                <!-- Mensagem de Feedback -->
                <div id="alert-editar-os" class="alert alert-success mb-md" role="alert" aria-live="polite" hidden></div>

                <!-- Estado de carregamento -->
                <div id="osLoading" class="text-center">
                    <p>Carregando ordem de serviço...</p>
                </div>

                <!-- Estado de erro -->
                <div id="osErro" class="alert mb-md" role="alert" aria-live="polite" hidden>
                    Não foi possível carregar esta ordem de serviço. Tente novamente mais tarde.
                </div>

                <!-- Formulário de Edição -->
                <form id="formEditarOS" class="card stack" novalidate hidden>
                    <div class="cluster-between">
                        <span class="section-title" style="margin: 0;">Informações do Serviço</span>
                        <span class="badge badge-primary-bg" style="font-size: 14px;" id="badgeOSId">ID: OS-—</span>
                    </div>

                    <!-- Título -->
                    <div class="form-group">
                        <label for="titulo" class="checkbox-label"><strong>Título do Serviço *</strong></label>
                        <input type="text" id="titulo" class="input" required>
                    </div>

                    <!-- Categoria e Modalidade -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria"><strong>Categoria *</strong></label>
                            <select id="categoria" class="input" required>
                                <option value="">Selecione</option>
                                <option value="Costura reta">Costura reta</option>
                                <option value="Overloque">Overloque</option>
                                <option value="Modelagem">Modelagem</option>
                                <option value="Peça piloto">Peça piloto</option>
                                <option value="Acabamento">Acabamento</option>
                                <option value="Bordado">Bordado</option>
                                <option value="Estamparia">Estamparia</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="modalidade"><strong>Modalidade *</strong></label>
                            <select id="modalidade" class="input" required>
                                <option value="">Selecione</option>
                                <option value="Presencial">Presencial</option>
                                <option value="Híbrida">Híbrida</option>
                                <option value="Remota">Remota</option>
                                <option value="Sob demanda">Sob demanda</option>
                            </select>
                        </div>
                    </div>

                    <!-- Cidade e Estado -->
                    <div class="form-row">
                        <div class="form-group autocomplete-wrapper">
                            <label for="cidade"><strong>Cidade *</strong></label>
                            <input type="text" id="cidade" class="input" placeholder="Ex: Blumenau" required>
                        </div>
                        <div class="form-group">
                            <label for="estado"><strong>Estado (UF) *</strong></label>
                            <select id="estado" class="input" required></select>
                        </div>
                    </div>

                    <!-- Valor e Prazo -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="valor"><strong>Valor do Serviço *</strong></label>
                            <input type="text" id="valor" class="input" placeholder="R$ 0,00" required>
                        </div>
                        <div class="form-group date-input-wrapper">
                            <label for="prazo"><strong>Prazo Estimado</strong></label>
                            <input type="date" id="prazo" class="input">
                        </div>
                    </div>

                    <!-- Previsão e Freelancer -->
                    <div class="form-row">
                        <div class="form-group date-input-wrapper">
                            <label for="previsao"><strong>Previsão de Conclusão</strong></label>
                            <input type="date" id="previsao" class="input">
                        </div>
                        <div class="form-group">
                            <label for="freelancer"><strong>Freelancer Atribuído</strong></label>
                            <input type="text" id="freelancer" class="input" disabled>
                        </div>
                    </div>

                    <!-- Empresa (somente leitura) -->
                    <div class="form-group">
                        <label for="empresa"><strong>Empresa Contratante</strong></label>
                        <input type="text" id="empresa" class="input" disabled>
                    </div>

                    <!-- Descrição -->
                    <div class="form-group">
                        <label for="descricao"><strong>Descrição do Serviço *</strong></label>
                        <textarea id="descricao" class="input" required></textarea>
                    </div>

                    <!-- Observações -->
                    <div class="form-group">
                        <label for="observacoes"><strong>Observações</strong></label>
                        <textarea id="observacoes" class="input"></textarea>
                    </div>

                    <!-- Anexos -->
                    <div class="section-title">Anexos</div>
                    <div class="form-group">
                        <label for="briefingInput"><strong>Briefing visual do serviço</strong></label>
                        <div class="upload-row">
                            <label class="btn btn-outline" for="briefingInput">
                                <i class="bi bi-image"></i> Anexar imagem
                            </label>
                            <input type="file" id="briefingInput" accept="image/*" hidden />
                        </div>
                        <div class="referencias-grid" id="briefingPreview"></div>
                        <span class="field-message">Imagem de até 5MB.</span>
                    </div>

                    <div class="form-actions">
                        <a href="/pages/16-ordens-servico.html" class="btn btn-outline">Cancelar</a>
                        <button type="submit" class="btn btn-primary" id="btnSubmit">
                            <i class="bi bi-save-fill"></i> Salvar Alterações
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/14-editar-os.js"></script>
</body>
</html>
