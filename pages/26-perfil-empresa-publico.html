<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freela da Moda - Perfil da Empresa</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/global.css" />
  </head>
  <body>
    <div class="app">
      <main class="main" role="main" aria-label="Conteúdo principal">

        <div class="header">
          <h2>Perfil da Empresa</h2>
          <div class="header-actions">
            <a href="javascript:history.back()" class="btn btn-outline">
              <i class="bi bi-arrow-left"></i> Voltar
            </a>
            <div id="header-acoes"></div>
          </div>
        </div>

        <!-- Estado de carregamento -->
        <div id="perfil-loading" class="text-center">
          <p>Carregando perfil...</p>
        </div>

        <!-- Estado de erro -->
        <div id="perfil-erro" class="alert" role="alert" aria-live="polite" hidden>
          Não foi possível carregar este perfil. Tente novamente mais tarde.
        </div>

        <!-- Conteúdo do perfil -->
        <div id="perfil-conteudo" hidden>

        <div class="profile-header">
          <div class="profile-avatar-lg" id="avatar-empresa"></div>
          <div class="profile-info">
            <h2 id="nome-empresa"></h2>
            <div class="profile-rating">
              <span id="estrelas-media"></span>
              <span id="texto-avaliacoes"></span>
            </div>
            <div class="profile-location">
              <i class="bi bi-geo-alt-fill"></i>
              <span id="localizacao-empresa"></span>
            </div>
            <div class="multi-select" style="margin-top: 4px;" id="selo-container">
              <span class="badge badge-primary-bg" id="selo-verificado" hidden><i class="bi bi-patch-check-fill"></i> Verificado</span>
            </div>
          </div>
          <div class="profile-actions">
            <button class="btn btn-primary btn-lg btn-ver-vagas">
              <i class="bi bi-briefcase-fill"></i> Ver vagas abertas
            </button>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="stack">
            <section class="card">
              <div class="section-title">Sobre a Empresa</div>
              <p id="descricao-empresa" style="color: var(--text-primary); line-height: 1.7; margin-bottom: 16px;"></p>
              <div class="profile-meta-row">
                <span class="profile-meta-label">Ramo de atuação</span>
                <span id="ramo-empresa" class="profile-meta-value"></span>
              </div>
              <div class="section-title" style="margin-top: 16px;">Referências</div>
              <div class="referencias-grid" id="lista-referencias"></div>
            </section>
            <section class="card">
              <div class="section-title">Vagas Ativas</div>
              <div id="lista-vagas-ativas" class="stack-sm" style="margin-top: 8px;"></div>
            </section>
          </div>
          <div class="stack">
            <section class="card">
              <div class="section-title">Avaliações Recebidas</div>
              <div id="lista-avaliacoes"></div>
            </section>
          </div>
        </div>
        <div class="text-center mt-lg">
          <button class="btn btn-primary btn-lg btn-ver-vagas">
            <i class="bi bi-briefcase-fill"></i> Ver vagas abertas para se candidatar
          </button>
        </div>
      </div>
      </main>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/26-perfil-empresa-publico.js"></script>
  </body>
</html>
