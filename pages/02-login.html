<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <script>
      // Restaura o tema salvo antes da primeira renderização (evita flash) e
      // mantém localStorage sincronizado sempre que data-theme mudar,
      // não importa qual botão/página fez a mudança.
      (function () {
        var root = document.documentElement;
        function sincronizarIcone(tema) {
          document.querySelectorAll('.theme-toggle i').forEach(function (icone) {
            icone.className = tema === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars';
          });
        }
        try {
          var salvo = localStorage.getItem('fdlm-theme');
          if (salvo) root.setAttribute('data-theme', salvo);
        } catch (e) {}
        new MutationObserver(function () {
          var atual = root.getAttribute('data-theme');
          try { localStorage.setItem('fdlm-theme', atual); } catch (e) {}
          sincronizarIcone(atual);
        }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
        document.addEventListener('DOMContentLoaded', function () {
          sincronizarIcone(root.getAttribute('data-theme'));
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Freela da Moda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/global.css" />
</head>
<body>

    <!-- HEADER SIMPLIFICADO -->
    <header class="site-header container">
        <a href="/pages/01-homepage.html" class="logo-area">
            <img src="/assets/logo-icone-roxo-2048.png" alt="Logo Freela da Moda" class="logo-img" />
            <div class="logo-text">
                <span>FREELA</span>
                <span>DA MODA</span>
            </div>
        </a>

        <div class="header-actions">
            <a href="/pages/01-homepage.html" class="btn btn-link"><i class="bi bi-arrow-left"></i> Voltar ao início</a>
        </div>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <main class="auth-container">
        <div class="auth-card">
            
            <div class="auth-header">
                <h1>Acesse sua conta</h1>
                <p>Boas-vindas de volta! Entre com seus dados.</p>
            </div>

            <!-- Seleção de Tipo de Conta -->
            <div class="role-selector">
                <div class="role-option active" id="tab-freelancer" data-role="freelancers">
                    <i class="bi bi-person"></i> Sou Freelancer
                </div>
                <div class="role-option" id="tab-empresa" data-role="empresas">
                    <i class="bi bi-building"></i> Sou Empresa
                </div>
            </div>

            <!-- Mensagens de Alerta/Erro -->
            <div id="auth-alert" class="auth-message"></div>

            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password" />
                        <i class="bi bi-eye toggle-password" id="toggleSenha"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="lembrar-me" />
                        Lembrar-me
                    </label>
                    <a href="#" class="forgot-link" id="link-esqueci-senha">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-purple w-full" id="btn-entrar" style="padding: 14px;">
                    Entrar na plataforma <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                Não tem uma conta? 
                <a href="/pages/05-cadastro-freelancer.html" id="link-cadastro">Cadastre-se como Freelancer</a>
            </div>

        </div>
    </main>

    <script src="/js/02-login.js"></script>
</body>
</html>
